---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config-pvc
  annotations:
    # WaitForFirstConsumer PVCs must share the Deployment's sync wave;
    # otherwise Argo waits for binding before creating the consumer.
    argocd.argoproj.io/sync-wave: "10"
  labels:
    vixens.io/config-owner: lidarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-rwo-retain
  resources:
    requests:
      storage: 2Gi
