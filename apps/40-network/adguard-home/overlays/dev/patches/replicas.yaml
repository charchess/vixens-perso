---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard-home
spec:
  replicas: 1
  template:
    spec:
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
      containers:
        - name: adguard-home
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: data
              mountPath: /opt/adguardhome/work
        - name: config-syncer
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
