---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    vixens.io/sizing: B-xlarge
spec:
  template:
    metadata:
      labels:
        vixens.io/sizing: B-xlarge
        vixens.io/sizing.homeassistant: B-xlarge
        vixens.io/sizing.config-syncer: B-small
      annotations:
        # Home Assistant uses B-xlarge burst capacity (2 CPU / 4Gi) during Core startup and backup recovery.
        # VPA recommendations remain available but must not in-place shrink this single-replica hostNetwork workload.
        vixens.io/vpa.update-mode: "Off"
        vixens.io/vpa.max-memory: "4096Mi"
