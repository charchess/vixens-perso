---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
    vixens.io/sizing: B-large
    vixens.io/backup-profile: "standard"
  annotations:
    secret.reloader.stakater.com/reload: homeassistant-config
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        vixens.io/sizing: B-large
        # Python wheels (NumPy/SciPy/Shapely) exceed unlabeled-init defaults.
        # Kyverno assigns V-small: 256Mi request / 1Gi limit.
        vixens.io/sizing.install-python-deps: V-small
        vixens.io/backup-profile: "standard"
      annotations:
        reloader.stakater.com/auto: "true"
        checksum/homeassistant-python-requirements: "968c121c5b560375a8b978dbf97792007df15c2c419331d0bea819f8e11a7c71"
        vixens.io/fast-start: "true"
        vixens.io/explicitly-allow-root: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: vixens-high
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: config-init
          image: busybox:1.38.0
          securityContext:
            # The restored PVC can retain root-owned generated directories.
            # This bootstrap normalizes their ownership before Core runs as 1000.
            runAsUser: 0
            capabilities:
              add: [CHOWN]
          command:
            - sh
            - -c
          args:
            - |
              if [ ! -s /config/configuration.yaml ]; then
                echo "No configuration found, copying default..."
                cp /tmp/ha-config/configuration.yaml /config/configuration.yaml
                chown 1000:1000 /config/configuration.yaml
              fi
              echo "Normalizing trusted proxy ranges for UMI/K3s/Traefik access..."
              awk '
                /^[[:space:]]*trusted_proxies:/ {
                  print;
                  print "    - 10.0.0.0/8";
                  print "    - 192.168.0.0/16";
                  print "    - 172.16.0.0/12";
                  in_tp=1;
                  next;
                }
                in_tp && /^[[:space:]]*-[[:space:]]/ { next; }
                in_tp && /^[[:space:]]*server_port:/ { in_tp=0; print; next; }
                { print; }
              ' /config/configuration.yaml > /config/configuration.yaml.tmp
              mv /config/configuration.yaml.tmp /config/configuration.yaml
              chown 1000:1000 /config/configuration.yaml
              ensure_file() {
                path="$1"
                content="$2"
                if [ ! -e "/config/$path" ]; then
                  printf "%s\n" "$content" > "/config/$path"
                  chown 1000:1000 "/config/$path"
                fi
              }
              ensure_file groups.yaml "{}"
              ensure_file automations.yaml "[]"
              ensure_file scripts.yaml "{}"
              ensure_file scenes.yaml "[]"
              ensure_file templates.yaml "[]"
              ensure_file switches.yaml "[]"
              ensure_file sensors.yaml "[]"
              ensure_file utility_meters.yaml "{}"
              ensure_file mediaplayer.yaml "[]"
              if [ ! -d /config/python_scripts ]; then
                mkdir -p /config/python_scripts
                chown 1000:1000 /config/python_scripts
              fi
              # Home Assistant manages custom-integration requirements in its
              # persistent Python user site. It must exist before Python starts
              # so site.py includes it in sys.path.
              mkdir -p /config/deps/lib/python3.14/site-packages
              chown 1000:1000 /config/deps /config/deps/lib \
                /config/deps/lib/python3.14 /config/deps/lib/python3.14/site-packages
              chmod 0755 /config/deps /config/deps/lib \
                /config/deps/lib/python3.14 /config/deps/lib/python3.14/site-packages
              # LLM Vision stores Timeline key frames under /media/llmvision.
              # /media is mounted from this persistent config volume below, so
              # key frames remain available for the configured retention period.
              mkdir -p /config/media/llmvision/snapshots
              chown -R 1000:1000 /config/media
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ha-config
              mountPath: /tmp/ha-config
              readOnly: true
      containers:
        - name: homeassistant
          # The official image opts into its root-owned system Python. Remove
          # that inherited opt-in before starting S6 so HA uses PYTHONUSERBASE.
          command: ["/bin/sh", "-ec", "unset UV_SYSTEM_PYTHON UV_PYTHON; exec /init"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          image: ghcr.io/home-assistant/home-assistant:2026.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 5683
              name: coiot
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Paris
            - name: PYTHONUSERBASE
              value: /config/deps
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            # Persist HA media (including LLM Vision Timeline key frames) on
            # the config PVC; the root init container prepares its subPath.
            - name: config
              mountPath: /media
              subPath: media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: ha-config
          secret:
            secretName: homeassistant-config
