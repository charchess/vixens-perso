---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    vixens.io/config-owner: prowlarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-rwo-retain
  resources:
    requests:
      storage: 2Gi
