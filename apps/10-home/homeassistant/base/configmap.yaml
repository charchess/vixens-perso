---
# MINIMAL GitOps configuration for Home Assistant
# Git-managed baseline configuration for Home Assistant.
# Sensitive data (tokens, credentials) are supplied only through
# OpenBao + External Secrets Operator (homeassistant-secrets).
#
# DO NOT put secrets here - they will be exposed in git history!
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-config
  namespace: homeassistant
  labels:
    app: homeassistant
  annotations:
    vixens.io/note: "Git-managed baseline; secrets supplied by OpenBao ESO"
data:
  configuration.yaml: |
    # Minimal Git-managed baseline configuration
    # Secrets are projected from the OpenBao-backed Kubernetes Secret via secrets.yaml

    # Load default integrations
    default_config:

    homeassistant:
      allowlist_external_urls:
        - "https://homeassistant.truxonline.com/local/"

    # Text to speech
    tts:
      - platform: google_translate

    # Include files managed by this application configuration
    group: !include groups.yaml
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
    template: !include templates.yaml
    switch: !include switches.yaml
    sensor: !include sensors.yaml
    utility_meter: !include utility_meters.yaml
    media_player: !include mediaplayer.yaml
    python_script:

    # Secrets are loaded from secrets.yaml (managed through OpenBao + External Secrets)
    # Additional integrations are configured through the Git-managed configuration.
