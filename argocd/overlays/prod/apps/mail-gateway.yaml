---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail-gateway
  namespace: argocd
  labels:
    vixens.lab/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-perso.git
    targetRevision: prod-stable
    path: apps/40-network/mail-gateway/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: mail-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
